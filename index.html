<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>My TG Web App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      padding: 20px;
      min-height: 100vh;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #f1f1f1);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; margin-bottom: 12px; }
    .user { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .user img { width: 48px; height: 48px; border-radius: 50%; }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:active { opacity: 0.8; }
    #counter { font-size: 32px; text-align: center; margin: 16px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Привет!</h1>
    <div class="user" id="userInfo">
      <span>Загрузка...</span>
    </div>
    <p style="opacity:0.7;font-size:14px">Это тестовый Web App</p>
  </div>

  <div class="card">
    <div id="counter">0</div>
    <button onclick="increment()">+1</button>
    <button onclick="sendData()">Отправить данные в бот</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Пользователь
    const user = tg.initDataUnsafe?.user;
    const userDiv = document.getElementById('userInfo');
    if (user) {
      userDiv.innerHTML = `
        ${user.photo_url ? `<img src="${user.photo_url}" alt="">` : ''}
        <div>
          <div style="font-weight:600">${user.first_name} ${user.last_name || ''}</div>
          <div style="font-size:13px;opacity:0.7">@${user.username || 'no username'}</div>
        </div>
      `;
    } else {
      userDiv.innerHTML = '<span>Откройте через Telegram</span>';
    }

    let count = 0;
    function increment() {
      count++;
      document.getElementById('counter').textContent = count;
      tg.HapticFeedback.impactOccurred('light');
    }

    function sendData() {
      tg.sendData(JSON.stringify({ count, action: 'test' }));
    }
  </script>
</body>
</html>
